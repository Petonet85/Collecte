name: Lame d'eau radar

# L'API DPRadar ne sert que le dernier pas de 5 minutes : ce qui n'est pas capte
# est perdu pour toujours. D'ou une capture toutes les 5 minutes, cadence minimale
# autorisee par le planificateur de GitHub.
#
# Choix de conception : un run court par pas de temps, plutot qu'un job qui boucle
# une demi-heure. A couverture egale, cela occupe un runner 20 % du temps au lieu
# de 100 %, et un run perdu ne coute que 5 minutes de donnees au lieu de trente.
# Les minutes sont gratuites sur un depot public, mais monopoliser un runner en
# continu sortirait de l'usage auquel Actions est destine.
#
# Le planificateur de GitHub retarde ou abandonne des executions en periode de
# charge : quelques trous sont a prevoir et sont acceptes. L'abonnement a
# DonneesPubliquesPaquetRadar les comblerait, chaque appel rendant le dernier
# quart d'heure, donc trois pas de temps au lieu d'un.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Un run en retard ne doit pas se superposer au suivant ni le faire attendre :
# la donnee du pas de temps courant prime sur celle qu'on a deja ratee.
concurrency:
  group: radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Capturer la lame d'eau
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
        run: python radar.py --depot donnees

      - name: Publier
        run: |
          if [ -z "$(git status --porcelain donnees)" ]; then
            echo "Pas de nouveau pas de temps."
            exit 0
          fi
          git config user.name  "collecte-automatique"
          git config user.email "actions@github.com"
          git add donnees
          git commit -m "Lame d'eau radar $(date -u '+%Y-%m-%dT%H:%MZ')"
          # Le collecteur Hub'Eau pousse aussi : on rejoue par-dessus plutot que
          # d'echouer, et on retente une fois si la course se repete.
          for essai in 1 2 3; do
            git pull --rebase --autostash -q && git push -q && exit 0
            sleep $((essai * 5))
          done
          exit 1
